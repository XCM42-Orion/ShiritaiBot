name: Verify installers

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n scripts/install.sh
      - run: python3 -m unittest discover -s scripts/tests -v

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test Node discovery and native arguments
        shell: ${{ matrix.shell }}
        run: ./scripts/tests/test_node.ps1
      - name: Test installer with real Node and npm
        shell: ${{ matrix.shell }}
        run: ./scripts/tests/test_windows_install.ps1
