[project]
name = "shiritaibot"
version = "0.2.1"
description = "An event-driven personal agent for OneBot"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "aiosqlite>=0.20,<1", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "httpx[socks]>=0.28,<1", "websockets>=15,<17", "pydantic>=2.10,<3",
  "typer>=0.15,<1", "tomli-w>=1.2,<2", "cryptography>=44",
  "psutil>=6,<8", "croniter>=6,<7", "tzdata>=2025", "jieba>=0.42,<1",
  "jsonschema>=4.23,<5", "numpy>=2,<3", "pillow>=11,<13", "pyyaml>=6,<7",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "python-pptx>=1,<2", "openpyxl>=3.1,<4",
  "xlrd>=2,<3", "olefile>=0.47,<1"
]

[project.optional-dependencies]
learn = ["requests>=2.32.3,<3", "beautifulsoup4>=4.12,<5", "gmssl==3.2.2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "pyright>=1.1", "xlwt>=1.3,<2"]

[project.scripts]
shiritaibot = "shiritaibot.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "ASYNC"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
# Concrete plugin directories are independent, gitignored projects. The host core
# remains checked through app.py's explicit import of shiritaibot.plugin.core.
exclude = ["src/shiritaibot/plugin/*"]
typeCheckingMode = "basic"

